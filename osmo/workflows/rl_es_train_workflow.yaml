#
# N-GPU distributed residual-RL training. Launches the train phase via
# torch.distributed.run --nproc_per_node={{num_gpus}} so each rank owns its
# own Isaac Sim instance pinned to a different GPU. Per-rank rollouts are
# collected in parallel ({{num_gpus}} x num_envs total transitions per iter);
# gradients are synced via manual all-reduce in PPO.update. The eval phase at
# the end is left as a single-process invocation since eval doesn't benefit
# from multi-GPU and the residual policy is small.
#
# cpu / memory are sized for an 8x L40 node and are NOT scaled per
# num_gpus — running with num_gpus < 8 over-allocates harmlessly; running
# with num_gpus > 8 would require bumping both knobs and picking a larger
# platform.
version: 2
workflow:
  name: {{workflow_name}}
  resources:
    default:
      cpu: 80
      gpu: {{num_gpus}}
      memory: 800Gi
      platform: ovx-l40
      storage: 400Gi
  tasks:
  - name: train
    image: {{image}}
    command: ["/bin/bash"]
    args: ["/tmp/entry.sh"]
    environment:
      ACCEPT_EULA: Y
    files:
    - contents: |
        # Set up environment
        apt update

        set -e
        # Hide conflicting Vulkan files, if needed
        if [ -e "/usr/share/vulkan" ] && [ -e "/etc/vulkan" ]; then
          mv /usr/share/vulkan /usr/share/vulkan_hidden
        fi

        python -m huggingface_hub.commands.huggingface_cli login --token {{hf_token}}

        # Generate your W&B API key: https://wandb.ai/authorize
        export WANDB_API_KEY={{wandb_api_key}}

        EMBODIMENT={{embodiment}}
        ENVIRONMENT={{environment}}
        NO_RESIDUAL={{no_residual}}
        NUREC_SCENE="{{nurec_scene}}"
        NUREC_REVISION="{{nurec_revision}}"
        NUREC_USD_FILE="{{nurec_usd_file}}"
        NUREC_OMAP_FILE="{{nurec_omap_file}}"
        TRAIN_CONFIG=configs/train_config.gin
        EVAL_CONFIG=configs/eval_config.gin

        # Download and unpack the COMPASS USDs from HuggingFace.
        echo "Downloading compass_usds.zip from huggingface.co/nvidia/COMPASS"
        python -m huggingface_hub.commands.huggingface_cli \
            download nvidia/COMPASS compass_usds.zip --local-dir ./
        unzip -q -o compass_usds.zip
        mv groot_mobility_rl_es_usds/usd ./compass/rl_env/exts/mobility_es/mobility_es/
        rm -rf groot_mobility_rl_es_usds compass_usds.zip

        if [[ -n "$NUREC_SCENE" ]]; then
          if [[ -z "$ENVIRONMENT" ]]; then
            ENVIRONMENT="$NUREC_SCENE"
          fi
          NUREC_REVISION_ARGS=()
          if [[ -n "$NUREC_REVISION" ]]; then
            echo "Downloading $NUREC_SCENE NuRec assets from $NUREC_REVISION"
            NUREC_REVISION_ARGS=(--revision "$NUREC_REVISION")
          else
            echo "Downloading $NUREC_SCENE NuRec assets from the dataset default revision"
          fi
          python -m huggingface_hub.commands.huggingface_cli \
              download nvidia/PhysicalAI-Robotics-NuRec --repo-type dataset \
              "${NUREC_REVISION_ARGS[@]}" \
              --local-dir ./compass/rl_env/exts/mobility_es/mobility_es/usd \
              --include "$NUREC_SCENE/**" \
              --exclude "**/raw_images.zip"
          TRAIN_CONFIG=configs/train_config_real2sim.gin
          EVAL_CONFIG=configs/eval_config_real2sim.gin
        fi

        # Create directory to store the training outputs.
        OUTPUT_DIR="{{output}}/outputs"
        mkdir -p $OUTPUT_DIR

        # Download X-Mobility base-policy checkpoint from HuggingFace.
        echo "Downloading X-Mobility checkpoint from huggingface.co/nvidia/X-Mobility"
        python -m huggingface_hub.commands.huggingface_cli \
            download nvidia/X-Mobility x_mobility-nav2-semantic_action_path.ckpt --local-dir ./
        mv x_mobility-nav2-semantic_action_path.ckpt model.ckpt

        # Download resume checkpoint if provided.
        RESUME_CKPT_ARTIFACT={{resume_ckpt_artifact}}
        if [[ -n $RESUME_CKPT_ARTIFACT ]]; then
          echo "Downloading resume checkpoint: $RESUME_CKPT_ARTIFACT"
          python -m wandb artifact get $RESUME_CKPT_ARTIFACT --root ./resume_ckpt/
          RESUME_CKPT=$(ls ./resume_ckpt/model_*.pt | sort -V | tail -n 1)
        fi

        # Launch training across {{num_gpus}} GPUs via torchrun. Each rank
        # spawns its own Isaac Sim instance + env; gradients sync via manual
        # all-reduce in PPO.update. Total parallel envs = {{num_gpus}} *
        # num_envs. NuRec assets are memory-heavy, so tune --num-envs per GPU.
        TRAIN_CMD="python -m torch.distributed.run --nproc_per_node={{num_gpus}} run.py --distributed -c $TRAIN_CONFIG -o $OUTPUT_DIR -n {{wandb_project_name}} -r {{wandb_run_name}} --logger wandb --video --num_envs {{num_envs}}"

        if [[ -n $EMBODIMENT ]]; then
          TRAIN_CMD+=" --embodiment $EMBODIMENT"
        fi

        if [[ -n $NUREC_SCENE ]]; then
          TRAIN_CMD+=" --nurec-scene $NUREC_SCENE"
        elif [[ -n $ENVIRONMENT ]]; then
          TRAIN_CMD+=" --environment $ENVIRONMENT"
        fi

        if [[ -n $NUREC_USD_FILE ]]; then
          TRAIN_CMD+=" --nurec-usd-file $NUREC_USD_FILE"
        fi
        if [[ -n $NUREC_OMAP_FILE ]]; then
          TRAIN_CMD+=" --nurec-omap-file $NUREC_OMAP_FILE"
        fi

        if [[ -z $NO_RESIDUAL ]]; then
          TRAIN_CMD+=" -b ./model.ckpt"
        fi

        if [[ -n $RESUME_CKPT_ARTIFACT ]]; then
          TRAIN_CMD+=" -p $RESUME_CKPT"
        fi

        echo $TRAIN_CMD
        eval $TRAIN_CMD

        # Launch evaluation of last checkpoint. Eval is single-process — it
        # uses one of the allocated GPUs and leaves the rest idle, which is
        # fine for a one-shot eval at the end of training.
        eval_ckpt=$(ls $OUTPUT_DIR/model_*.pt | sort -V | tail -n 1)
        ckpt_name=$(basename "$eval_ckpt")
        EVAL_CMD="python run.py -c $EVAL_CONFIG -o $OUTPUT_DIR -p $eval_ckpt -n {{wandb_project_name}} -r eval_{{wandb_run_name}}_$ckpt_name --logger wandb --video --video_interval 1 --num_envs {{num_envs}}"
        if [[ -z $NO_RESIDUAL ]]; then
          EVAL_CMD+=" -b ./model.ckpt"
        fi

        if [[ -n $EMBODIMENT ]]; then
          EVAL_CMD+=" --embodiment $EMBODIMENT"
        fi

        if [[ -n $NUREC_SCENE ]]; then
          EVAL_CMD+=" --nurec-scene $NUREC_SCENE"
        elif [[ -n $ENVIRONMENT ]]; then
          EVAL_CMD+=" --environment $ENVIRONMENT"
        fi

        if [[ -n $NUREC_USD_FILE ]]; then
          EVAL_CMD+=" --nurec-usd-file $NUREC_USD_FILE"
        fi
        if [[ -n $NUREC_OMAP_FILE ]]; then
          EVAL_CMD+=" --nurec-omap-file $NUREC_OMAP_FILE"
        fi

        echo $EVAL_CMD
        eval $EVAL_CMD

      path: /tmp/entry.sh
    - contents: |
        {
            "launch_config": {
                "headless": true
            }
        }
      path: /tmp/config.json

default-values:
  image: ""
  workflow_name: compass_rl_es_train
  num_gpus: 8
  num_envs: 32
  no_residual: ""
  resume_ckpt_artifact: ""
  embodiment: ""
  environment: ""
  nurec_scene: ""
  nurec_revision: ""
  nurec_usd_file: ""
  nurec_omap_file: ""
